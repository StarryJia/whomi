appId: local.whomi.desktop
productName: Whomi
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: branding/icon.png
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: electron/vendor/chatlab-parser/LICENSE
    to: licenses/chatlab/LICENSE
  - from: electron/vendor/chatlab-parser/UPSTREAM.md
    to: licenses/chatlab/UPSTREAM.md
asar: true
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: false
publish: null
