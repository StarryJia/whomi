appId: local.whomi.desktop
productName: Whomi
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: src/vendor/virtua-resize/LICENSE
    to: licenses/virtua/LICENSE
  - from: src/vendor/virtua-resize/UPSTREAM.md
    to: licenses/virtua/UPSTREAM.md
  - from: LICENSE
    to: licenses/whomi/LICENSE
  - from: node_modules/jose/LICENSE.md
    to: licenses/jose/LICENSE.md
  - from: node_modules/openai/LICENSE
    to: licenses/openai/LICENSE
  - from: src/vendor/cherry-providers/LICENSE
    to: licenses/cherry-providers/LICENSE
  - from: src/vendor/cherry-providers/UPSTREAM.md
    to: licenses/cherry-providers/UPSTREAM.md
  - from: src/vendor/cherry-markdown/LICENSE
    to: licenses/cherry-markdown/LICENSE
  - from: src/vendor/cherry-markdown/UPSTREAM.md
    to: licenses/cherry-markdown/UPSTREAM.md
  - from: src/vendor/cherry-chat/LICENSE
    to: licenses/cherry-chat/LICENSE
  - from: src/vendor/cherry-chat/shared/LICENSE
    to: licenses/cherry-chat/shared/LICENSE
  - from: src/vendor/cherry-chat/UPSTREAM.md
    to: licenses/cherry-chat/UPSTREAM.md
  - from: src/vendor/cherry-chat/composer/source-manifest.json
    to: licenses/cherry-chat/composer/source-manifest.json
  - from: src/vendor/cherry-chat/messages/source-manifest.json
    to: licenses/cherry-chat/messages/source-manifest.json
  - from: src/vendor/cherry-chat/shared/source-manifest.json
    to: licenses/cherry-chat/shared/source-manifest.json
  - from: build/icon.png
    to: branding/icon.png
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: electron/vendor/chatlab-parser/LICENSE
    to: licenses/chatlab/LICENSE
  - from: electron/vendor/chatlab-parser/UPSTREAM.md
    to: licenses/chatlab/UPSTREAM.md
  - from: electron/vendor/cherry-studio/LICENSE
    to: licenses/cherry-studio/LICENSE
  - from: docs/research/cherry-settings-reuse.md
    to: licenses/cherry-studio/settings-reuse.md
  - from: docs/research/cherry-conversation-reuse.md
    to: licenses/cherry-studio/conversation-reuse.md
  - from: docs/research/cherry-protocol-reuse.md
    to: licenses/cherry-studio/protocol-reuse.md
  - from: docs/research/cherry-catalog-selection.md
    to: licenses/cherry-studio/catalog-selection.md
  - from: docs/research/chatlab-ai-thread-reuse.md
    to: licenses/chatlab/ai-thread-reuse.md
asar: true
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: false
publish: null
